# Sapia v1 preset (1,045,145,472 parameters; see docs/DESIGN_V1.md). Mirrors sapia.config.PRESETS["sapia"].
# Use with:  python -m sapia.train --config configs/sapia.yaml [--flag value ...]
# "auto" means: decided at startup from the detected GPU/RAM/CPU and logged.
# Training settings are provisional until the training design is written.
preset: sapia

model:
  vocab_size: 49152        # SmolLM2 tokenizer
  block_size: 2048         # maximum context (final phase); the main phase uses main_block_size
  n_layer: 28
  n_head: 16               # head dim 112
  n_kv_head: 4             # grouped-query attention, 4 query heads per K/V head
  d_model: 1792
  mlp_hidden: 4864         # SwiGLU, ~2.71 x d_model
  rope_base: 10000.0
  norm_eps: 1.0e-6
  qk_norm: true
  z_loss: 1.0e-4
  tie_embeddings: true
  dropout: 0.0

data_dir: data/sapia-mix
out_dir: runs/sapia

# ---- budget (the LR schedule is defined over max_tokens; set it from the throughput trial)
max_tokens: 7_500_000_000
max_steps: auto
max_hours: auto
max_total_hours: auto

# ---- memory-aware batch settings
batch_size: auto
grad_accum_steps: auto
target_tokens_per_step: 524_288
max_batch_size: 512
vram_fraction: 0.85
reuse_batch_plan: true

# ---- optimizer / schedule
optimizer: muon            # Muon for hidden matrices + AdamW for the rest; or adamw
muon_momentum: 0.95
main_block_size: 1024      # context in the main phase; the anneal phase uses model.block_size
learning_rate: 5.0e-4
lr_schedule: wsd           # warmup, constant, linear decay over the anneal phase
min_lr_ratio: 0.0
anneal_fraction: 0.1       # last 10% of tokens: anneal mix + lr decay
warmup_tokens: 150_000_000
weight_decay: 0.1          # applied to >=2D parameters only
beta1: 0.9
beta2: 0.95
adam_eps: 1.0e-8
grad_clip: 1.0

# ---- precision
precision: bf16
compile: true              # ignored on Windows

# ---- data loading
data_mode: auto
num_workers: auto
prefetch_factor: auto

# ---- evaluation / logging / checkpoints
eval_interval: 250
eval_tokens: 1_048_576
log_interval: 10
ckpt_interval: 250
ckpt_minutes: 30.0
keep_last: 2
metrics_seconds: 10.0
save_best: true
resume: auto

max_nan_skips: 10
seed: 1337
device: auto
tpu: false                 # --tpu: train on TPU chips with PyTorch/XLA (Kaggle)
tpu_tokens_per_chip: 2048  # TPU micro-batch per chip; lower if the TPU runs out of memory
tpu_flash: true
wandb: true
wandb_project: sapia
ntfy_topic: auto           # or set SAPIA_NTFY_TOPIC
notify_every_tokens: 1_000_000_000
peak_flops: auto
dry_run: false
