# A few-million-parameter Sapia-shaped model for smoke tests on any GPU or CPU.
# Mirrors sapia.config.PRESETS["tiny"].
preset: tiny

model:
  vocab_size: 49152
  block_size: 128
  n_layer: 4
  n_head: 4
  n_kv_head: 2
  d_model: 128
  mlp_hidden: 352

main_block_size: 64

data_dir: data/tiny
out_dir: runs/tiny
max_tokens: 1_600_000
compile: false
target_tokens_per_step: 8192
max_batch_size: 64
learning_rate: 1.0e-3
warmup_tokens: 80_000
eval_interval: 50
eval_tokens: 16_384
log_interval: 10
ckpt_interval: 50
ckpt_minutes: 0.0
